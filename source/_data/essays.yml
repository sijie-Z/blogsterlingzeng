- date: 2026-08-28
  content: |
    博客更新了。四篇新文章,从 MiQroGate 的凭证虚拟化,到 A 股反转研究的执行之痛。
    写的过程中把两个写作风格仓库翻了一遍,学会了一件事:数字比形容词有力。
    五十个账号,五十条并发,0.45 到 -0.27。这些数字自己会说话。

- date: 2026-08-27
  content: |
    nft-launchpad-kit 发布 v1.0.0 之前,列了十五个 issue。
    最刺眼的一条:CI 从来没跑过。三份 workflow 躺在子目录里,躺了三个月。
    发布冲刺做的事,不是修十五个问题,是把"我不知道"变成"我知道"。

- date: 2026-08-26
  content: |
    MiQroGate 上线了。品牌改名、仓库转公开,历史压成一次提交重新发布。
    一个真实的 API Key 被虚拟成可以轮换、吊销、计量的钥匙。
    五十个账号的问题,现在由一行配置回答。

- date: 2026-08-25
  content: |
    A 股反转研究封档。2018 到 2025,IC 曲线全部为负,80 日最强,统计显著。
    然后月频执行把它吃掉了:0.45 到 -0.27。
    信号存在,不等于策略可投资。这句话值 0.72 的夏普差距。

- date: 2026-05-08
  content: |
    博客终于上线了。说"终于"是因为这个念头在我脑子里盘旋了至少两年。
    一直在等"准备好了"的那一刻，后来发现那一刻永远不会来。
    先做出来，再慢慢改。这大概是编程教会我最重要的一件事。

- date: 2026-05-07
  content: |
    花了一整天选主题，从 Hugo 到 Hexo，从 Butterfly 到 Redefine。
    选技术栈和选餐厅一样，看太多评价反而更纠结。
    最后选了 Redefine，原因很简单：它的文档写得好。
    一个项目文档的质量，往往反映了代码的质量。

- date: 2026-05-06
  content: |
    今天 debug 到凌晨两点。一个看似简单的异步问题，排查了四个小时。
    最后发现是 Promise 链里漏了一个 return。
    这种 bug 最气人——不报错，不崩溃，就是结果不对。
    但找到问题的那一刻，那种"原来如此"的感觉，确实是编程独有的快乐。

- date: 2026-05-05
  content: |
    重读了自己两年前写的代码，发现两个问题：
    1. 变量命名真的很烂
    2. 逻辑其实很简单，但被我写得很复杂
    成长大概就是这样——你能看出过去自己的问题了。

- date: 2026-05-04
  content: |
    有人问我"学编程最重要的是什么"。
    我想了很久，答案是：忍受不确定性的能力。
    你永远不知道下一个 bug 在哪里，永远不知道这个方案能不能行。
    但你得继续写下去。

- date: 2026-05-03
  content: |
    今天把一个 200 行的函数重构成了 5 个 40 行的函数。
    代码行数没变，但可读性提升了十倍。
    好的代码不是短，而是每个部分都只做一件事。
