- date: 2026-05-10
  content: |
    一口气写了 5 篇项目复盘文章，从量化平台到 RAG 系统到 NFT 合约。
    写完发现，最大的收获不是文章本身，而是逼自己重新审视了每个项目的设计决策。
    很多当时觉得"理所当然"的选择，现在回头看其实有更好的方案。

- date: 2026-05-09
  content: |
    用 Claude Code 重构了整个博客项目，从零搭建到 12 篇文章 + 评论系统 + 音乐播放器，一天搞定。
    AI 编程工具确实在改变工作方式。但核心的东西没变——你得知道自己要什么，AI 才能帮你实现。

- date: 2026-05-08
  content: |
    博客终于上线了。说"终于"是因为这个念头在我脑子里盘旋了至少两年。
    一直在等"准备好了"的那一刻，后来发现那一刻永远不会来。
    先做出来，再慢慢改。这大概是编程教会我最重要的一件事。

- date: 2026-05-07
  content: |
    花了一整天选主题，从 Hugo 到 Hexo，从 Butterfly 到 Redefine。
    选技术栈和选餐厅一样，看太多评价反而更纠结。
    最后选了 Redefine，原因很简单：它的文档写得好。
    一个项目文档的质量，往往反映了代码的质量。

- date: 2026-05-06
  content: |
    今天 debug 到凌晨两点。一个看似简单的异步问题，排查了四个小时。
    最后发现是 Promise 链里漏了一个 return。
    这种 bug 最气人——不报错，不崩溃，就是结果不对。
    但找到问题的那一刻，那种"原来如此"的感觉，确实是编程独有的快乐。

- date: 2026-05-05
  content: |
    重读了自己两年前写的代码，发现两个问题：
    1. 变量命名真的很烂
    2. 逻辑其实很简单，但被我写得很复杂
    成长大概就是这样——你能看出过去自己的问题了。

- date: 2026-05-04
  content: |
    有人问我"学编程最重要的是什么"。
    我想了很久，答案是：忍受不确定性的能力。
    你永远不知道下一个 bug 在哪里，永远不知道这个方案能不能行。
    但你得继续写下去。

- date: 2026-05-03
  content: |
    今天把一个 200 行的函数重构成了 5 个 40 行的函数。
    代码行数没变，但可读性提升了十倍。
    好的代码不是短，而是每个部分都只做一件事。

- date: 2026-04-28
  content: |
    做 DocMind RAG 系统的时候，发现检索质量比大模型能力重要得多。
    你给大模型 garbage context，它就给你 garbage answer。
    所以 RAG 的核心不是 prompt engineering，是 retrieval engineering。

- date: 2026-04-20
  content: |
    第一次用 Solidity 写智能合约，被"immutable"这个概念震撼了。
    部署上去就不能改了？那 bug 怎么办？
    后来理解了：这就是为什么智能合约需要那么严格的测试。
    代码即法律，不是说说而已。

- date: 2026-04-15
  content: |
    学了一周 PostGIS，终于理解了为什么 GIS 要用专门的空间数据库。
    "这个点在不在这个区域内"——听起来简单，但要在百万级数据上毫秒级返回，需要 R-Tree 索引。
    计算机科学的美就在于：看似简单的问题，背后都有精妙的算法。

- date: 2026-04-10
  content: |
    量化交易最大的陷阱不是策略不行，是回测太好看。
    前视偏差、幸存者偏差、过拟合——每一个都能让你的回测年化 50%，实盘亏 50%。
    做了量化平台之后，我对"数据驱动"有了更深的理解：
    数据不会说谎，但你的处理方式会让它说谎。
