name: Content Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 检查 front matter、站内链接、图片引用和文风硬规则,不依赖浏览器
      - name: Content checks
        run: npm run test:content
