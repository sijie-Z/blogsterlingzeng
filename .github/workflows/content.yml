name: Content Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  content:
    runs-on: ubuntu-latest
    env:
      # 站点时区是 Asia/Shanghai;CI 默认 UTC 会让 00:00 的文章路径漂到前一天
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 检查 front matter、站内链接、图片引用和文风硬规则,不依赖浏览器
      - name: Content checks
        run: npm run test:content

      # 构建后再查一遍真实产物的站内链接
      - name: Build
        run: npm run build

      - name: Internal link checks
        run: npm run test:links
